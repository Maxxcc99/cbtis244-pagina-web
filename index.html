<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Web - Maximiliano Corona</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #38bdf8;
      font-size: 32px;
      margin-bottom: 8px;
    }
    h2 {
      color: #f1f5f9;
      font-size: 22px;
      margin-bottom: 16px;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
    }
    .school-info {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      border: 1px solid #334155;
    }
    .school-info h3 {
      margin: 0;
      color: #38bdf8;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>¡Bienvenido a mi sitio web!</h1>
    <h2>Creado por: Maximiliano Corona</h2>
    <p>Esta es mi página web personal alojada en un servidor web gratuito para la materia de informática.</p>
    
    <div class="school-info">
      <h3>CBTis No. 244</h3>
      <p style="margin: 4px 0 0 0; color: #cbd5e1;">Magdalena, Jalisco, México</p>
    </div>

    <!-- Imagen del plantel escolar -->
    <img src="https://www.mcleanschool.org/wp-content/uploads/2026/01/Lochinver-Lane-Campus-2019-1680x840.webp" alt="CBTis 244 Magdalena Jalisco">
  </div>

</body>
</html>
